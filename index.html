<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>تاكسي إسكندرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2622;--sun:#f2bd2a;--sea:#2fb0c0;--sand:#f4cfa8}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sand);font-family:Tajawal,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(10px,env(safe-area-inset-top)) 14px 0;pointer-events:none;color:#fff;font-weight:800}
.pill{background:#2b2622b0;border-radius:12px;padding:6px 12px;font-size:15px}
#spd b{font-size:22px}
#task{position:fixed;top:56px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff;font-size:14px}
#toast{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);background:var(--sun);color:var(--ink);font-weight:800;font-size:22px;padding:10px 22px;border-radius:14px;opacity:0;transition:opacity .35s;pointer-events:none}
.btn{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;background:#ffffff45;border:2px solid #ffffffa0;display:flex;align-items:center;justify-content:center;touch-action:none}
.btn.on{background:#ffffffa0}
.btn svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.btn.on svg{stroke:var(--ink)}
#b1{left:16px}#b2{left:102px}#b3{right:102px}#b4{right:16px;background:#f2bd2a99}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#2b2622d9,#2b2622a6);color:#fff;text-align:center;padding:20px}
.ov h1{margin:0;font-size:44px;font-weight:800;color:var(--sun)}
.ov p{margin:0;font-size:16px;max-width:360px;line-height:1.7}
.go{background:var(--sun);color:var(--ink);border:0;border-radius:14px;font:800 20px Tajawal,sans-serif;padding:12px 44px}
.sub{background:none;color:#fff;border:1px solid #fff8;border-radius:12px;font:500 14px Tajawal,sans-serif;padding:7px 20px}
#cr{display:none;direction:ltr;font-size:14px}
#rot{display:none;position:fixed;inset:0;background:var(--ink);color:#fff;align-items:center;justify-content:center;font-size:20px;font-weight:800;z-index:9}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<div id="hud">
  <div class="pill" id="area">المنتزه</div>
  <div class="pill"><span id="money">0</span> جنيه</div>
  <div class="pill" id="spd"><b>0</b> كم/س</div>
</div>
<div class="pill" id="task"></div>
<div id="toast"></div>
<div class="btn" id="b1" data-k="ArrowLeft"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
<div class="btn" id="b2" data-k="ArrowRight"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
<div class="btn" id="b3" data-k="ArrowDown"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></div>
<div class="btn" id="b4" data-k="ArrowUp"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></div>
<div class="ov" id="start">
  <h1>تاكسي إسكندرية</h1>
  <p>سوق على الكورنيش من المنتزه لحد العجمي. قف عند الدايرة الصفرا تركّب الراكب، وقف عند الخضرا توصّله.</p>
  <button class="go" id="play">ابدأ</button>
  <button class="sub" id="crb">الحقوق</button>
  <p id="cr"></p>
</div>
<div id="rot">لف الموبايل بالعرض</div>
